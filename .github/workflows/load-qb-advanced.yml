name: Load NFL Advanced QB Metrics

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        type: choice
        options: ['2025', '2026']
        default: '2026'
  schedule:
    # Tuesday 9:40 AM ET year-round via dual UTC schedules + local-time guard.
    - cron: '40 13 * * 2'
    - cron: '40 14 * * 2'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - id: guard
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "$(TZ=America/New_York date +%H:%M)" == "09:40" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Load cumulative advanced QB metrics
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '2026' }}
        run: python scripts/load_qb_advanced_metrics.py --season "$SEASON"
