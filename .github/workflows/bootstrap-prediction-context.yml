name: Bootstrap NFL Prediction Context

on:
  push:
    branches: [main]
    paths:
      - 'scripts/load_depth_charts.py'
      - 'scripts/load_qb_advanced_metrics.py'
      - '.github/workflows/bootstrap-prediction-context.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Load 2025 and 2026 depth chart snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/load_depth_charts.py --season 2025
          python scripts/load_depth_charts.py --season 2026
      - name: Load advanced QB baselines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/load_qb_advanced_metrics.py --season 2025
          python scripts/load_qb_advanced_metrics.py --season 2026
