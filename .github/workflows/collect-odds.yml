name: Collect NFL Odds

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without inserting odds history
        type: boolean
        default: true
      days:
        description: Upcoming window in days (1-14)
        type: choice
        options: ['1', '3', '7', '14']
        default: '7'

permissions:
  contents: read

concurrency:
  group: collect-nfl-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Temporary SportsGameOdds curl diagnostic
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        shell: bash
        run: |
          set +x
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --get \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --data-urlencode "apiKey=$SPORTSGAMEODDS_API_KEY" \
            --data-urlencode 'leagueID=NFL' \
            --data-urlencode 'oddsAvailable=true' \
            --data-urlencode 'limit=1' \
            'https://api.sportsgameodds.com/v2/events') || true
          printf 'HTTP status: %s\n' "$http_status"
          python - "$response_file" <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.parse import quote, quote_plus

          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  body = json.load(response)
          except (ValueError, OSError):
              sys.exit(0)
          if not isinstance(body, dict):
              sys.exit(0)

          key = os.environ.get("SPORTSGAMEODDS_API_KEY", "")
          def sanitize(value):
              if isinstance(value, str):
                  if key:
                      for secret in (key, quote(key, safe=""), quote_plus(key)):
                          value = value.replace(secret, "[REDACTED]")
                  return re.sub(r"https?://\S+", "[URL omitted]", value)
              if isinstance(value, list):
                  return [sanitize(item) for item in value]
              if isinstance(value, dict):
                  return {sanitize(k): sanitize(v) for k, v in value.items()}
              return value

          print(json.dumps({
              "success": body.get("success") if isinstance(body.get("success"), bool) else None,
              "error": sanitize(body.get("error")),
              "data_items": len(body["data"]) if isinstance(body.get("data"), list) else 0,
          }, ensure_ascii=True))
          PY
      - name: Collect pregame odds
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          DAYS: ${{ inputs.days }}
        run: |
          args=(--days "$DAYS" --max-pages 4)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/collect_odds.py "${args[@]}"
