name: Collect NFL Odds

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without inserting odds history
        type: boolean
        default: true
      days:
        description: Upcoming window in days (1-14)
        type: choice
        options: ['1', '3', '7', '14']
        default: '7'
  schedule:
    # Run both UTC possibilities, then gate by the live America/New_York offset.
    # Desired ET times: daily 8:00 AM, 2:00 PM, 8:00 PM;
    # Sunday additionally 10:00 AM, 12:00 PM, 12:45 PM.
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 14 * * 0'
    - cron: '0 15 * * 0'
    - cron: '0 16 * * 0'
    - cron: '0 17 * * 0'
    - cron: '45 16 * * 0'
    - cron: '45 17 * * 0'

permissions:
  contents: read

concurrency:
  group: collect-nfl-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Eastern schedule
        id: eastern
        if: github.event_name == 'schedule'
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          offset = int(datetime.now(ZoneInfo("America/New_York")).utcoffset().total_seconds() // 3600)
          cron = os.environ["TRIGGER_CRON"]
          edt = {
              "0 12 * * *", "0 18 * * *", "0 0 * * *",
              "0 14 * * 0", "0 16 * * 0", "45 16 * * 0",
          }
          est = {
              "0 13 * * *", "0 19 * * *", "0 1 * * *",
              "0 15 * * 0", "0 17 * * 0", "45 17 * * 0",
          }
          should_run = cron in (edt if offset == -4 else est if offset == -5 else set())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"Eastern UTC offset: {offset}; trigger: {cron}; run: {should_run}")
          PY
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.eastern.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.eastern.outputs.run == 'true'
        with:
          python-version: '3.12'
      - if: github.event_name != 'schedule' || steps.eastern.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - if: github.event_name != 'schedule' || steps.eastern.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Collect pregame odds
        if: github.event_name != 'schedule' || steps.eastern.outputs.run == 'true'
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.days }}
        run: |
          args=(--days "$DAYS" --max-pages 4)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/collect_odds.py "${args[@]}"
