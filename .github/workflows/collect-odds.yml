name: Collect NFL Odds

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without inserting odds history
        type: boolean
        default: true
      days:
        description: Upcoming window in days (1-14)
        type: choice
        options: ['1', '3', '7', '14']
        default: '7'

permissions:
  contents: read

concurrency:
  group: collect-nfl-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect pregame odds
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          DAYS: ${{ inputs.days }}
        run: |
          args=(--days "$DAYS" --max-pages 4)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/collect_odds.py "${args[@]}"
