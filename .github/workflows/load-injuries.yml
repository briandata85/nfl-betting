name: Load NFL Injury Report

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: '2026'
      week:
        description: Regular-season week
        required: true
        default: '1'
  schedule:
    # GitHub cron is UTC: Wed/Thu/Fri 6:30 PM ET and Sat 11:00 AM ET in EDT.
    - cron: '30 22 * * 3-5'
    - cron: '0 15 * * 6'

permissions:
  contents: read

jobs:
  load-injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - name: Load NFL.com injury snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEASON: ${{ github.event_name == 'schedule' && '2026' || inputs.season }}
        run: |
          args=(--season "$SEASON")
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            args+=(--auto-week)
          else
            args+=(--week "${{ inputs.week }}")
          fi
          python scripts/load_injuries.py "${args[@]}"
