name: Backfill NFL History

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: First season to backfill
        required: true
        default: '2019'
      end_season:
        description: Last season to backfill
        required: true
        default: '2025'

permissions:
  contents: read

jobs:
  backfill-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Backfill regular-season games and weekly metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          START_SEASON: ${{ inputs.start_season }}
          END_SEASON: ${{ inputs.end_season }}
        run: python scripts/backfill_history.py --start-season "$START_SEASON" --end-season "$END_SEASON"
