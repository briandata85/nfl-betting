name: Backtest Moneyline Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_moneyline.py'
      - 'tests/test_backtest_moneyline.py'
      - '.github/workflows/backtest-moneyline.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run walk-forward moneyline backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/backtest_moneyline.py
