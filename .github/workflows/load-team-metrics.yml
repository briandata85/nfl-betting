name: Load NFL Team Metrics

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to load
        required: true
        type: choice
        options: ['2025', '2026']
        default: '2026'

permissions:
  contents: read

jobs:
  load-team-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Upsert completed team metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/load_team_metrics.py --season "${{ inputs.season }}"
